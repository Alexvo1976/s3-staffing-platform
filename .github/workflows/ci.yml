name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: s3staffing
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d s3staffing"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test

      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/s3staffing?schema=public

      PORT: 4000
      WEB_ORIGIN: http://localhost:3000

      AUTH_MODE: local
      LOCAL_ADMIN_EMAIL: admin@s3staffing.local
      LOCAL_ADMIN_PASSWORD: TestPassword123!
      JWT_SECRET: ci-test-jwt-secret-do-not-use-in-production

      AWS_REGION: us-east-1
      S3_BUCKET: s3-staffing-ci
      S3_FORCE_PATH_STYLE: "true"

      STORAGE_DRIVER: s3
      MAX_RESUME_BYTES: 5242880

      EMAIL_DRIVER: smtp
      EMAIL_FROM: no-reply@s3-staffing.com
      STAFF_NOTIFICATION_EMAIL: hire@s3-staffing.com
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_SECURE: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm exec -w @s3/api -- prisma generate

      - name: Validate Prisma schema
        run: npm exec -w @s3/api -- prisma validate

      - name: Apply database migrations
        run: npm exec -w @s3/api -- prisma migrate deploy

      - name: Lint and TypeScript checks
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build application
        run: npm run build
